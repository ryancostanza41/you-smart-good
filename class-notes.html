    Alternatively:
    print("What city are we in? ")

print(x)
y:int = int(input("Give me another number: "))

print(x + y)

firstOp:int = int(input("Give me a number: "))
secondOp:int = int(input("Give me another number: "))
print("firstOp + secondOp = " + str(firstOp + secondOp))        >>if you input str(firstOp) + str(secondOp) then they will run as individual strings. str() around the whole problem will keep them as integers until after they are added, then the solution will become a string.
print(str(firstOp) + " + " + str(secondOp) + " = "+ str(firstOp + secondOp))            >>to view the actual numbers, instead of seeing "firstOp + secondOp" in the terminal.
